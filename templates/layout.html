{{define "layout"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}Invoice App{{end}}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root { --pico-font-size: 95%; }
    body { padding-bottom: 4rem; }
    nav a[aria-current="page"] { font-weight: 700; }
    .muted { color: var(--pico-muted-color); }
    .grid-2 { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr)); }
    .summary-card strong { display: block; font-size: 1.1rem; }
    .notice { margin-bottom: 1rem; }
    .invoice-sheet {
      background: white; color: #111827; padding: 2rem;
      border: 1px solid #d1d5db; border-radius: 12px;
    }
    .invoice-sheet,
    .invoice-sheet * {
      --pico-background-color: white;
      --pico-color: #111827;
      --pico-muted-color: #6b7280;
      --pico-text-color: #111827;
      --pico-h1-color: #111827;
      --pico-h3-color: #111827;
      --pico-table-border-color: #d1d5db;
      --pico-table-row-stripped-background-color: transparent;
      --pico-primary-background: #111827;
      --pico-primary-color: white;
    }
    .invoice-sheet figure {
      margin: 1.5rem 0;
      --pico-block-spacing-vertical: 0;
    }
    .invoice-sheet p, .invoice-sheet small, .invoice-sheet div {
      --pico-color: #111827;
      color: #111827;
    }
    .invoice-sheet small { color: #6b7280; }
    .invoice-sheet table {
      width: 100%; border-collapse: collapse;
      background: white;
    }
    .invoice-sheet thead { border-bottom: 2px solid #111827; }
    .invoice-sheet thead th {
      text-align: left; padding: 0.6rem 0.75rem;
      color: #111827; background: #f3f4f6;
      font-weight: 700; font-size: 0.9rem;
      border-bottom: 2px solid #111827;
    }
    .invoice-sheet tbody td {
      padding: 0.5rem 0.75rem; border-bottom: 1px solid #e5e7eb;
      color: #111827; background: white;
    }
    .invoice-sheet tbody tr:last-child td { border-bottom: none; }
    .invoice-sheet tfoot { border-top: 2px solid #111827; }
    .invoice-sheet tfoot th,
    .invoice-sheet tfoot td {
      padding: 0.6rem 0.75rem; color: #111827;
      background: #f3f4f6; font-weight: 700;
    }
    .invoice-meta, .bank-details { display: grid; gap: 0.5rem; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .preline { white-space: pre-line; }
    @media print {
      nav, .notice, .no-print, footer { display: none !important; }
      main.container { width: 100%; max-width: none; }
      .invoice-sheet { border: none; padding: 0; }
      body { background: white; }
    }
  </style>
</head>
<body>
  <main class="container">
    <nav>
      <ul>
        <li><strong>Invoice App</strong></li>
      </ul>
      <ul>
        <li><a href="/">Dashboard</a></li>
        <li><a href="/entries">Entries</a></li>
        <li><a href="/rates">Rates</a></li>
        <li><a href="/invoices">Invoices</a></li>
        <li><a href="/settings">Settings</a></li>
      </ul>
    </nav>
    {{block "content" .}}{{end}}
  </main>
</body>
</html>
{{end}}
