{{define "title"}}Register - Invoice App{{end}}

{{define "content"}}
<article class="auth-card">
  <hgroup>
    <h2>Create Account</h2>
    <p>Create your passkey to get started</p>
  </hgroup>

  {{if .Notice}}
  <p class="auth-notice auth-notice-{{.NoticeKind}}">{{.Notice}}</p>
  {{end}}

  <p id="auth-status" class="auth-status" role="status" aria-live="polite"></p>

  <form id="register-form">
    <label for="username">
      Username
      <input type="text" id="username" name="username" required autocomplete="username webauthn" placeholder="Choose a username" aria-describedby="username-help">
    </label>
    <small id="username-help" class="muted">Use 3-32 lowercase letters, numbers, dots, underscores, or hyphens.</small>
    <button type="submit" id="register-btn">Create Account with Passkey</button>
  </form>

  <p class="auth-switch">
    Already have an account? <a href="/login">Sign in</a>
  </p>
</article>
<script src="/static/auth.js" defer></script>
{{end}}
