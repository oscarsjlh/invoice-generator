{{define "title"}}Sign In - Invoice App{{end}}

{{define "content"}}
<article class="auth-card">
  <hgroup>
    <h2>Sign In</h2>
    <p>Use your passkey to sign in</p>
  </hgroup>

  {{if .Notice}}
  <p class="auth-notice auth-notice-{{.NoticeKind}}">{{.Notice}}</p>
  {{end}}

  <p id="auth-status" class="auth-status" role="status" aria-live="polite"></p>

  <form id="login-form" data-next="{{.Next}}">
    <label for="username">
      Username
      <input type="text" id="username" name="username" required autocomplete="username webauthn" placeholder="Enter your username" aria-describedby="username-help">
    </label>
    <small id="username-help" class="muted">Use lowercase letters, numbers, dots, underscores, or hyphens.</small>
    <button type="submit" id="login-btn">Sign in with Passkey</button>
  </form>

  {{if registrationEnabled}}
  <p class="auth-switch">
    Don't have an account? <a href="/register">Create one</a>
  </p>
  {{end}}
</article>
<script src="/static/auth.js" defer></script>
{{end}}
