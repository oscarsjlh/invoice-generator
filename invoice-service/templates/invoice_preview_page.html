{{define "title"}}Invoice {{.Invoice.InvoiceNumber}}{{end}}

{{define "content"}}
{{if .Notice}}
<article class="notice no-print">{{.Notice}}</article>
{{end}}

<div class="no-print invoice-toolbar">
  <a href="/invoices" role="button" class="secondary">Back to Invoices</a>
  <a href="/invoices/{{.Invoice.ID}}/pdf" role="button" class="secondary">Download PDF</a>
  <form method="post" action="/invoices/{{.Invoice.ID}}/send" class="inline-form">
    <input type="hidden" name="csrf_token" value="">
    <button type="submit" class="secondary">Send to Customer</button>
  </form>
  <form method="post" action="/invoices/{{.Invoice.ID}}/delete" class="inline-form" onsubmit="return confirm('Delete this invoice?');">
    <input type="hidden" name="csrf_token" value="">
    <button type="submit" class="secondary">Delete</button>
  </form>
  <a role="button" class="secondary" href="#" onclick="window.print(); return false;">Print</a>
</div>

{{template "invoice_preview_fragment" .Invoice}}
{{end}}
