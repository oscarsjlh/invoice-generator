{{define "entries_table"}}
<div id="entries-table">
  {{if .Entries}}
  <figure>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Category</th>
          <th>Hours</th>
          <th>Notes</th>
          <th class="no-print">Actions</th>
        </tr>
      </thead>
      <tbody>
        {{range .Entries}}
        <tr>
          <td>{{dateLabel .Date}}</td>
          <td>{{.Category}}</td>
          <td>{{money .Hours}}</td>
          <td>{{if .Notes}}{{.Notes}}{{else}}<span class="muted">-</span>{{end}}</td>
          <td class="no-print">
            <div style="display: flex; gap: 0.25rem;">
              <button type="button" class="secondary" hx-get="/entries/{{.ID}}/edit" hx-target="closest tr" hx-swap="outerHTML">Edit</button>
              <button type="button" class="secondary" hx-post="/entries/{{.ID}}/delete" hx-target="#entries-table" hx-swap="outerHTML" hx-confirm="Delete this entry?">Delete</button>
            </div>
          </td>
        </tr>
        {{end}}
      </tbody>
    </table>
  </figure>
  {{else}}
  <p class="muted">No entries yet.</p>
  {{end}}
</div>
{{end}}
