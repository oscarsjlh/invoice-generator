{{define "invoice_list"}}
{{if .Invoices}}
<figure>
  <table>
    <thead>
      <tr>
        <th>Number</th>
        <th>Month</th>
        <th>Category</th>
        <th>Invoice Date</th>
        <th>Due Date</th>
        <th>Total</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {{range .Invoices}}
      <tr>
        <td><a href="/invoices/{{.ID}}">{{.InvoiceNumber}}</a></td>
        <td>{{.Month}}</td>
        <td>{{.Category}}</td>
        <td>{{dateLabel .InvoiceDate}}</td>
        <td>{{dateLabel .DueDate}}</td>
        <td>GBP {{money .Total}}</td>
        <td>
          <form method="post" action="/invoices/{{.ID}}/delete" class="inline-form" onsubmit="return confirm('Delete this invoice?');">
            <input type="hidden" name="csrf_token" value="">
            <button type="submit" class="secondary">Delete</button>
          </form>
        </td>
      </tr>
      {{end}}
    </tbody>
  </table>
</figure>
{{else}}
<p class="muted">No invoices generated yet.</p>
{{end}}
{{end}}
