services:
  invoice-app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ADDRESS: ":8080"
      DATABASE_PATH: "/app/data/invoices.db"
      TEMPLATES_DIR: "/app/templates"
      MIGRATIONS_DIR: "/app/migrations"
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: ""
    volumes:
      - ./data:/app/data
      - ./templates:/app/templates
    restart: unless-stopped
